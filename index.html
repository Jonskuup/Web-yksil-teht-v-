<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suomen opiskelijaravintolat</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <div>
          <h1>Suomen opiskelijaravintolat</h1>
          <p>Löydä lähin opiskelijaravintola.</p>
        </div>

        <div class="auth-controls">
          <button type="button" id="user-status" hidden></button>
          <button type="button" id="login-button">Kirjaudu sisään</button>
          <button type="button" id="logout-button" hidden>Kirjaudu ulos</button>
        </div>
      </div>
    </header>

    <nav>
      <button type="button" id="all-restaurants-button">
        Kaikki ravintolat
      </button>
      <button type="button" id="favorites-button">♥ Suosikit</button>
    </nav>

    <!--Kirjautuminen osio-->
    <dialog id="auth-dialog">
      <button type="button" id="close-auth-dialog">X</button>

      <div id="login-section">
        <h2>Kirjaudu sisään</h2>

        <form id="login-form">
          <label for="login-username">Käyttäjänimi</label>
          <input type="text" id="login-username" required />

          <label for="login-password">Salasana</label>
          <input type="password" id="login-password" required />

          <button type="submit">Kirjaudu</button>
        </form>

        <p>Etkö ole vielä rekisteröitynyt?</p>
        <button type="button" id="show-register">Rekisteröidy</button>
      </div>

      <div id="register-section" hidden>
        <h2>Luo käyttäjätili</h2>

        <form id="register-form">
          <label for="register-username">Käyttäjänimi</label>
          <input type="text" id="register-username" required />

          <label for="register-email">Sähköposti</label>
          <input type="email" id="register-email" required />

          <label for="register-password">Salasana</label>
          <input type="password" id="register-password" required />

          <button type="submit">Rekisteröidy</button>
        </form>

        <p>Onko sinulla jo tunnus?</p>
        <button type="button" id="show-login">Kirjaudu sisään</button>
      </div>

      <p id="auth-message"></p>
    </dialog>

    <!-- Omat tiedot osio -->
    <dialog id="profile-dialog">
      <button type="button" id="close-profile-dialog">X</button>

      <h2>Omat tiedot</h2>

      <p id="profile-username"></p>

      <form id="profile-form">
        <label for="profile-email">Sähköposti:</label>
        <input type="email" id="profile-email" required />

        <button type="submit">Tallenna muutokset</button>
      </form>

      <p id="profile-message"></p>
    </dialog>

    <main>
      <section class="filters">
        <input
          type="search"
          id="search-input"
          placeholder="Etsi ravintolaa..."
        />

        <!-- valintalistat -->
        <select id="city-filter">
          <option value="">Kaikki kaupungit</option>
        </select>

        <select id="company-filter">
          <option value="">Kaikki palveluntarjoajat</option>
        </select>
      </section>

      <section class="restaurant-section" id="restaurant-section">
        <h2>Ravintolat</h2>
        <!-- ravintolakortit id-->
        <div class="restaurant-list" id="restaurant-list">
          <p>Ravintoloita ladataan...</p>
        </div>
      </section>

      <!-- Klikatun ravintolan näkymä -->
      <dialog id="restaurant-dialog">
        <button type="button" id="close-dialog">X</button>

        <h2 id="restaurant-name"></h2>
        <p id="restaurant-info"></p>

        <div class="menu-buttons">
          <button type="button" id="daily-menu-button">
            Päivän ruokalista
          </button>
          <button type="button" id="weekly-menu-button">
            Viikon ruokalista
          </button>
        </div>

        <div id="menu-list"></div>
      </dialog>
    </main>
  </body>
</html>
